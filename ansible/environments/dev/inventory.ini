# Control Plane Nodes (master[0] is primary; master[1:] are secondary HA masters)
[master]
control-plane ansible_host=192.168.1.95 hostname=control-plane

# Worker Nodes
[workers]
node-01 ansible_host=192.168.2.30  hostname=node-01
node-02 ansible_host=192.168.2.140 hostname=node-02
node-03 ansible_host=192.168.2.242 hostname=node-03
node-04 ansible_host=192.168.2.191 hostname=node-04

# Parent group combining all cluster nodes (used by containerd & k8s-binaries)
[kubernetes:children]
master
workers
