# Worker Nodes
[workers]
node-01 ansible_host=192.168.2.124 hostname=node-01
node-02 ansible_host=192.168.2.178 hostname=node-02
node-03 ansible_host=192.168.2.203 hostname=node-03
node-04 ansible_host=192.168.2.36  hostname=node-04

