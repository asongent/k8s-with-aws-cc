---
- name: Check if node is already joined to the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join worker node to cluster
  when: not kubelet_conf.stat.exists
  block:
    - name: Get IMDSv2 Token
      ansible.builtin.uri:
        url: "http://169.254.169"
        method: PUT
        headers:
          X-aws-ec2-metadata-token-ttl-seconds: "21600"
        return_content: true
      register: imds_token

    - name: Fetch EC2 Instance ID
      ansible.builtin.uri:
        url: "http://169.254.169"
        headers:
          X-aws-ec2-metadata-token: "{{ imds_token.content }}"
        return_content: true
      register: ec2_instance_id_res

    - name: Fetch EC2 Availability Zone
      ansible.builtin.uri:
        url: "http://169.254.169"
        headers:
          X-aws-ec2-metadata-token: "{{ imds_token.content }}"
        return_content: true
      register: ec2_az_res

    - name: Generate kubeadm join command on Master
      ansible.builtin.command: kubeadm token create --print-join-command
      delegate_to: "{{ groups['master'][0] }}"
      run_once: true
      register: join_command_raw

    - name: Render kubeadm join config with AWS provider-id
      ansible.builtin.copy:
        dest: /tmp/kubeadm-join.yaml
        mode: '0644'
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: JoinConfiguration
          discovery:
            bootstrapToken:
              apiServerEndpoint: "{{ join_command_raw.stdout.split()[2] }}"
              token: "{{ join_command_raw.stdout.split()[4] }}"
              caCertHashes:
                - "{{ join_command_raw.stdout.split()[6] }}"
          nodeRegistration:
            name: "{{ hostname }}"
            criSocket: "unix:///run/containerd/containerd.sock"
            kubeletExtraArgs:
              - name: "provider-id"
                value: "aws:///{{ ec2_az_res.content }}/{{ ec2_instance_id_res.content }}"
              - name: "node-ip"
                value: "{{ ansible_default_ipv4.address }}"
              - name: "cloud-provider"
                value: "external"

    - name: Run kubeadm join
      ansible.builtin.command:
        cmd: kubeadm join --config /tmp/kubeadm-join.yaml
        creates: /etc/kubernetes/kubelet.conf